# pgfx example configuration.
#
# The section names are the application's choice - they are passed to confx when
# wiring (confx.ProvideDefault[pgfx.Config]("postgres"), confx.Provide[...]
# ("replica", "replica")). Each connection is its own top-level table. This file
# holds only open settings - passwords come from the environment, never here.

# ---------------------------------------------------------------------------
# Default connection - confx.ProvideDefault[pgfx.Config]("postgres") + pgfx.Module().
# Environment prefix: POSTGRES_
# ---------------------------------------------------------------------------
[postgres]
# Endpoint as "host" or "host:port" (port defaults to 5432). Also readable as
# POSTGRES_HOST, which overrides this value.
host     = "localhost:5432"
database = "orders"
# user is optional: omit it to fall back to PGUSER / the OS user (peer auth).
user     = "orders"
# Password is optional and NEVER in the file: set POSTGRES_PASSWORD in the
# environment, or omit it for a passwordless / .pgpass connection.
# Reported as application_name in pg_stat_activity.
app_name = "orders-service"

  [postgres.tls]
  # libpq sslmode: disable | allow | prefer | require | verify-ca | verify-full.
  # SECURITY: prefer/allow may fall back to plaintext and skip verification; use
  # verify-full with root_cert for MITM protection.
  mode        = "verify-full"
  # Certificate file PATHS (read by libpq), not PEM contents. For in-memory or
  # secret-manager certificates, use pgfx.WithTLS(*tls.Config) instead.
  cert        = "/run/secrets/client.crt"
  key         = "/run/secrets/client.key"
  root_cert   = "/run/secrets/ca.crt"
  server_name = "db.internal"

  [postgres.pool]
  # All optional; a zero/omitted value keeps the pgxpool default.
  max_conns                = 20
  min_conns                = 2
  min_idle_conns           = 2
  max_conn_lifetime        = "30m"
  max_conn_lifetime_jitter = "5m"
  max_conn_idle_time       = "15m"
  health_period            = "1m"

  [postgres.timeouts]
  # Bounds establishing a single connection. Zero leaves the pgx default.
  connect = "5s"

# ---------------------------------------------------------------------------
# A named connection - confx.Provide[pgfx.Config]("replica", "replica") +
# pgfx.ModuleFor("replica"). Its own top-level table, same fields as above.
# Environment prefix: REPLICA_ (e.g. REPLICA_PASSWORD).
# ---------------------------------------------------------------------------
[replica]
host     = "replica:5432"
database = "orders"
user     = "orders_ro"

  [replica.tls]
  mode = "require"

  [replica.pool]
  max_conns = 10
