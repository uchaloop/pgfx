      <circle cx="-85" cy="-40" r="78" fill="#fff" stroke-width="18"/>
      <circle cx="90" cy="-40" r="78" fill="#fff" stroke-width="18"/>
      <circle cx="-65" cy="-30" r="30" fill="#0B1F3A" stroke="none"/>
      <circle cx="110" cy="-30" r="30" fill="#0B1F3A" stroke="none"/>
      <circle cx="-55" cy="-43" r="10" fill="#fff" stroke="none"/>
