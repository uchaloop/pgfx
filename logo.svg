    <!-- elephant: ears, head -->
    <ellipse cx="170" cy="440" rx="130" ry="160" fill="#5B8FD0"/>
    <ellipse cx="182" cy="448" rx="74" ry="104" fill="#3E6FB0" stroke="none"/>
    <ellipse cx="530" cy="440" rx="130" ry="160" fill="#5B8FD0"/>
    <ellipse cx="518" cy="448" rx="74" ry="104" fill="#3E6FB0" stroke="none"/>
    <circle cx="350" cy="430" r="190" fill="#5B8FD0"/>
    <path d="M215 370 A150 150 0 0 1 270 300" fill="none" stroke="#8FB6E6" stroke-width="16" opacity=".9"/>

