    <circle cx="285" cy="440" r="19" fill="#0B1F3A" stroke="none"/>
    <circle cx="415" cy="440" r="19" fill="#0B1F3A" stroke="none"/>
    <circle cx="291" cy="433" r="6" fill="#fff" stroke="none"/>
    <circle cx="421" cy="433" r="6" fill="#fff" stroke="none"/>

