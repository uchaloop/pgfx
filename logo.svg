    <path d="M292 548 q-8 38 22 58" fill="none" stroke-width="36"/>
    <path d="M292 548 q-8 38 22 58" fill="none" stroke="#fff" stroke-width="14"/>
    <path d="M408 548 q8 38 -22 58" fill="none" stroke-width="36"/>
    <path d="M408 548 q8 38 -22 58" fill="none" stroke="#fff" stroke-width="14"/>

