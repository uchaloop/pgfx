    <circle cx="456" cy="674" r="41" fill="#0B1F3A" stroke="none"/>
    <path d="M350 470 V625 C350 672 370 700 405 700 C428 700 446 690 456 674" fill="none" stroke="#5B8FD0" stroke-width="42" stroke-linecap="butt"/>
    <circle cx="456" cy="674" r="21" fill="#5B8FD0" stroke="none"/>
    <path d="M319 521 C319 500 312 485 300 474 M381 521 C381 500 388 485 400 474" fill="none" stroke-width="20"/>
    <path d="M338 585 h24 M338 620 h24" fill="none" stroke="#3E6FB0" stroke-width="7"/>

